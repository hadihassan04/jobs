    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },

            destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
            muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
            accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
            card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {

        --card-foreground: 240 10% 3.9%;
        --primary: 240 5.9% 10%;

        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 240 10% 3.9%;
        --radius: 0.5rem;
      }
      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --card: 240 10% 3.9%;
        --card-foreground: 0 0% 98%;
        --primary: 0 0% 98%;
        --primary-foreground: 240 5.9% 10%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --accent: 240 3.7% 15.9%;
        --accent-foreground: 0 0% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 3.7% 15.9%;
        --input: 240 3.7% 15.9%;
        --ring: 240 4.9% 83.9%;
      }
      * { border-color: hsl(var(--border)); }
      body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
    }
  </style>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .col.over { outline: 2px dashed hsl(var(--ring)); outline-offset: 2px; }
    .card.dragging { opacity: 0.4; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 36px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
      border: 1px solid hsl(var(--input)); background: hsl(var(--background));
    }
    .btn:active { background: hsl(var(--accent)); }
    .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; }
    .btn-danger { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); border-color: transparent; }
    @media (max-width: 767px) {
      .board-desktop { display: none !important; }
    }
    @media (min-width: 768px) {
      .board-mobile { display: none !important; }
    }
  </style>
</head>

g-ai-working-student", "notes": "Added 2026-09-03 from official EN career page. Python + ML prototypes/training data. “Ideally master’s” but STEM bachelor not hard-blocked. Apply by email to careers@moresophy.com with CV + cover letter + references. Language bar not stated on EN page.", "filters": ["munich", "remote", "eu"], "f_munich": true, "f_remote": true, "f_eu": true, "f_all": true}, {"id": "ommax-ai-enable", "col": "stretch", "role": "Intern / Working Student – AI & Business Enablement", "company": "OMMAX", "track": "Munich", "location": "Munich (hybrid; also other EU cities — pick Munich)", "mode": "Hybrid", "hours": "Intern or working student", "language": "English fluent; local language a plus", "fit": "Stretch", "salary": "Attractive salary packages (no number)", "posted": "", "deadline": "", "url": "https://ommax.jobs.personio.de/job/2404873?language=en", "notes": "Added 2026-09-03: official Personio id 2404873 live. AI CoE enablement (less product-engineering than sibling AI Engineering & Automation). English fluent; local language a plus. Pick Munich.", "filters": ["munich", "eu"], "f_munich": true, "f_remote": false, "f_eu": true, "f_all": true}];
const STORE = "job-kanban-v2";
const THEME = "job-kanban-theme";
const FILTERS = [
  { id: "all", label: "All" },
  { id: "munich", label: "Munich" },
  { id: "eu", label: "EU" },
  { id: "remote", label: "Remote" },
];
let filter = localStorage.getItem("job-kanban-filter") || "all";
if (filter === "all" && false) {}
let mobileCol = localStorage.getItem("job-kanban-mcol") || "apply";
let expandAll = false;
const ext = `<svg class="ml-1 h-3 w-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>`;

function applyTheme(mode) {
  document.documentElement.classList.toggle("dark", mode === "dark");
  document.getElementById("theme").textContent = mode === "dark" ? "Light" : "Dark";
  localStorage.setItem(THEME, mode);
}
applyTheme(localStorage.getItem(THEME) || "light");

function today() { return new Date("2026-09-03"); }
function daysUntil(iso) {
  if (!iso) return null;
  return Math.ceil((new Date(iso + "T23:59:59") - today()) / 86400000);
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return structuredClone(DEFAULT_JOBS);
    const byId = Object.fromEntries(JSON.parse(raw).map(j => [j.id, j]));
    return DEFAULT_JOBS.map(j => byId[j.id] ? { ...j, col: byId[j.id].col } : { ...j });
  } catch { return structuredClone(DEFAULT_JOBS); }
}
let jobs = load();
function save() {
  localStorage.setItem(STORE, JSON.stringify(jobs.map(j => ({ id: j.id, col: j.col }))));
}
function inFilter(j) {
  if (filter === "munich") return j.f_munich;
  if (filter === "eu") return j.f_eu;
  if (filter === "remote") return j.f_remote;
  return j.f_all;
}
function matches(j, q) {
  if (!inFilter(j)) return false;
  if (!q) return true;
  return [j.company, j.role, j.location, j.language, j.notes, j.track].join(" ").toLowerCase().includes(q);
}
function badge(text, variant) {
  if (!text) return "";
  const base = "inline-flex items-center rounded-md border px-2 py-0.5 text-[11px] font-medium";
  const map = {
    default: "border-transparent bg-primary text-primary-foreground",
    secondary: "border-transparent bg-secondary text-secondary-foreground",
    outline: "text-foreground",
    destructive: "border-transparent bg-destructive text-destructive-foreground",
  };
  return `<span class="${base} ${map[variant] || map.outline}">${esc(text)}</span>`;
}
function langBadge(lang) {
  const l = (lang || "").toLowerCase();
  if (l.includes("german required") || l.includes("deutsch")) return badge(lang, "destructive");
  if (l.includes("english-only")) return badge(lang, "default");
  if (l.includes("not mentioned")) return badge(lang, "outline");
  return badge(lang, "secondary");
}
function isMobile() { return window.matchMedia("(max-width: 767px)").matches; }

function cardHTML(j) {
  const due = daysUntil(j.deadline);
  let dueB = "";
  if (j.deadline) {
    const label = due === 0 ? "Due today" : due === 1 ? "Due tomorrow" : due < 0 ? "Passed" : `Due in ${due}d`;
    dueB = badge(label, due !== null && due <= 3 ? "destructive" : "secondary");
  }
  const apply = j.url
    ? `<a href="${esc(j.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="btn h-8 text-xs">Open ${ext}</a>`
    : `<span class="text-xs text-muted-foreground">No link</span>`;
  return `
    <article class="card rounded-lg border bg-card p-3 text-card-foreground shadow-sm" draggable="true" data-id="${esc(j.id)}">
      <div class="space-y-2">
        <div>
          <p class="text-[11px] font-medium uppercase tracking-wider text-muted-foreground">${esc(j.company)}</p>
          <h3 class="text-sm font-medium leading-snug">${esc(j.role)}</h3>
        </div>
        <div class="flex flex-wrap gap-1">
          ${badge(j.track, "secondary")}
          ${langBadge(j.language)}
          ${badge(j.fit === "Yes" ? "Fit" : j.fit, j.fit === "Yes" ? "secondary" : "outline")}
          ${j.salary && !String(j.salary).toLowerCase().includes("not posted") ? badge(j.salary, "outline") : ""}
          ${dueB}
        </div>
        <p class="text-xs text-muted-foreground">${esc(j.location)} · ${esc(j.mode)} · ${esc(j.hours)}</p>
        <div class="flex flex-wrap items-center gap-2">
          ${apply}
          <button type="button" class="text-xs text-muted-foreground" onclick="event.stopPropagation(); const n=this.closest('.card').querySelector('[data-notes]'); n.classList.toggle('hidden'); this.textContent = n.classList.contains('hidden') ? 'Notes' : 'Hide'">${expandAll ? "Hide" : "Notes"}</button>
        </div>
        <p data-notes class="text-xs leading-relaxed text-muted-foreground ${expandAll ? "" : "hidden"}">${esc(j.notes)}${j.posted ? " Posted: " + esc(j.posted) + "." : ""}</p>
      </div>
    </article>`;
}

function filteredFor(colId) {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return jobs.filter(j => j.col === colId && matches(j, q));
}

function renderFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(f => {
    const on = filter === f.id;
    return `<button type="button" data-filter="${f.id}" class="btn ${on ? "btn-primary" : ""}">${esc(f.label)}</button>`;
  }).join("");
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      localStorage.setItem("job-kanban-filter", filter);
      render();
    });
  });
}

function renderColNav() {
  const nav = document.getElementById("colnav");
  nav.innerHTML = `<div class="flex gap-2 overflow-x-auto pb-1">${COLUMNS.map(([id, title]) => {
    const n = filteredFor(id).length;
    const on = mobileCol === id;
    return `<button type="button" data-mcol="${id}" class="btn shrink-0 ${on ? "btn-primary" : ""}">${esc(title)} ${n}</button>`;
  }).join("")}</div>`;
  nav.querySelectorAll("[data-mcol]").forEach(btn => {
    btn.addEventListener("click", () => {
      mobileCol = btn.dataset.mcol;
      localStorage.setItem("job-kanban-mcol", mobileCol);
      render();
    });
  });
}

function columnHTML(id, title, sub, list, extraClass) {
  return `<section class="col flex w-full flex-col rounded-xl border bg-muted/50 ${extraClass || ""}" data-col="${id}">
    <div class="flex items-start justify-between gap-2 px-3 py-3">
      <div>
        <h2 class="text-sm font-semibold">${esc(title)}</h2>
        <p class="text-xs text-muted-foreground">${esc(sub)}</p>
      </div>
      <span class="inline-flex h-5 min-w-5 items-center justify-center rounded-md border bg-background px-1.5 text-[11px] font-medium">${list.length}</span>
    </div>
    <div class="cards flex flex-1 flex-col gap-2 px-2 pb-3">${list.map(cardHTML).join("") || '<p class="px-2 pb-2 text-xs text-muted-foreground">Nothing here.</p>'}</div>
  </section>`;
}

function render() {
  renderFilters();
  renderColNav();
  const board = document.getElementById("board");
  if (isMobile()) {
    const col = COLUMNS.find(c => c[0] === mobileCol) || COLUMNS[1];
    const list = filteredFor(col[0]);
    board.className = "board-mobile bg-muted/40 p-3";
    board.innerHTML = columnHTML(col[0], col[1], col[2], list, "");
  } else {
    board.className = "board-desktop flex min-h-[calc(100vh-140px)] gap-4 overflow-x-auto bg-muted/40 p-4";
    board.innerHTML = COLUMNS.map(([id, title, sub]) => columnHTML(id, title, sub, filteredFor(id), "w-[320px] shrink-0")).join("");
  }
  bindDnD();
}

let dragId = null;
function bindDnD() {
  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("dragstart", e => {
      dragId = el.dataset.id;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      dragId = null;
      document.querySelectorAll(".col").forEach(c => c.classList.remove("over"));
    });
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); e.dataTransfer.dropEffect = "move"; });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain") || dragId;
      const job = jobs.find(j => j.id === id);
      if (!job) return;
      job.col = col.dataset.col;
      save();
      render();
    });
  });
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("expand").addEventListener("click", () => {
  expandAll = !expandAll;
  document.getElementById("expand").textContent = expandAll ? "Hide notes" : "Notes";
  render();
});
document.getElementById("theme").addEventListener("click", () => {
  applyTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");
});
document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Reset all cards to the original columns?")) return;
  localStorage.removeItem(STORE);
  jobs = structuredClone(DEFAULT_JOBS);
  render();
});
document.getElementById("csv").addEventListener("click", () => {
  const cols = ["col","company","role","track","location","mode","hours","language","fit","salary","posted","deadline","url","notes"];
  const lines = [cols.join(",")];
  for (const j of jobs.filter(inFilter)) lines.push(cols.map(k => '"' + String(j[k] ?? "").replaceAll('"','""') + '"').join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join(String.fromCharCode(10))], { type: "text/csv" }));
  a.download = "job-tracker.csv";
  a.click();
});
window.addEventListener("resize", () => render());
render();
</script>
</body>
</html>
